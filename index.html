<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐在线播放器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url('images/bg0.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            transition: background-image 0.5s ease;
        }

        .player {
            position: relative;
            z-index: 1;
            width: 400px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .player:hover {
            transform: translateY(-5px);
        }

        .cover {
            width: 200px;
            height: 200px;
            margin: 0 auto 20px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            animation: rotate 20s linear infinite;
            animation-play-state: paused;
        }

        .cover.playing {
            animation-play-state: running;
        }

        .cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .song-info {
            text-align: center;
            margin-bottom: 20px;
        }

        .song-name {
            font-size: 20px;
            font-weight: bold;
            color: white;
            margin-bottom: 8px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .student-info {
            font-size: 14px;
            color: white;
            background: rgba(118, 75, 162, 0.6);
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            margin-top: 5px;
            backdrop-filter: blur(5px);
        }

        .time-area {
            margin: 15px 0;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: white;
            margin-bottom: 8px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
        }

        .progress-bar::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin: 20px 0;
        }

        .controls button {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            backdrop-filter: blur(5px);
        }

        .controls button:hover {
            background: rgba(118, 75, 162, 0.8);
            color: white;
            transform: scale(1.05);
        }

        .play-btn {
            width: 60px !important;
            height: 60px !important;
            background: rgba(118, 75, 162, 0.8) !important;
            color: white !important;
            font-size: 24px !important;
        }

        .play-btn:hover {
            background: rgba(118, 75, 162, 0.9) !important;
        }

        .volume-area {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
            padding: 10px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            backdrop-filter: blur(5px);
        }

        .volume-icon {
            font-size: 18px;
            cursor: pointer;
            width: 30px;
            text-align: center;
            color: white;
            transition: color 0.3s ease;
        }

        .volume-icon:hover {
            color: #d4c4ec;
        }

        .volume-slider {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            cursor: pointer;
        }

        .volume-value {
            font-size: 12px;
            color: white;
            width: 40px;
            text-align: right;
        }

        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            color: white;
            transition: background 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .action-btn:hover {
            background: rgba(118, 75, 162, 0.7);
        }

        .bg-btn {
            background: rgba(118, 75, 162, 0.5);
        }

        .bg-btn:hover {
            background: rgba(118, 75, 162, 0.8);
        }

        .playlist {
            margin-top: 15px;
            max-height: 0;
            overflow-y: auto;
            transition: max-height 0.3s ease;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        .playlist.show {
            max-height: 250px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 5px 0;
        }

        .playlist-item {
            padding: 10px 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s ease;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }

        .playlist-item:hover {
            background: rgba(118, 75, 162, 0.5);
        }

        .playlist-item.active {
            background: rgba(118, 75, 162, 0.8);
            color: white;
        }

        .playlist-item img {
            width: 40px;
            height: 40px;
            border-radius: 5px;
            object-fit: cover;
        }

        .playlist-item .item-info {
            flex: 1;
        }

        .playlist-item .song-title {
            font-size: 14px;
            font-weight: 500;
        }

        .playlist-item .song-artist {
            font-size: 11px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="player">
        <div class="cover" id="cover">
            <img id="coverImg" src="images/record0.jpg" alt="封面">
        </div>

        <div class="song-info">
            <div class="song-name" id="songName">歌曲0</div>
            <div class="student-info">学号：24215220230 | 姓名：唐宇</div>
        </div>

        <div class="time-area">
            <div class="time-display">
                <span id="currentTime">00:00</span>
                <span id="totalTime">00:00</span>
            </div>
            <input type="range" class="progress-bar" id="progress" value="0" step="1">
        </div>

        <div class="controls">
            <button id="prevBtn" title="上一首">⏮</button>
            <button class="play-btn" id="playBtn" title="播放/暂停">▶</button>
            <button id="nextBtn" title="下一首">⏭</button>
        </div>

        <div class="volume-area">
            <span class="volume-icon" id="muteBtn" title="静音">🔊</span>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80">
            <span class="volume-value" id="volumeValue">80%</span>
        </div>

        <div class="button-row">
            <button class="action-btn" id="playlistToggle">📋 播放列表</button>
            <button class="action-btn bg-btn" id="bgToggleBtn">🎨 切换背景</button>
        </div>

        <div class="playlist" id="playlist">
        </div>
    </div>

    <audio id="audio" src="audio/music0.mp3"></audio>

    <script>
        const playlist = [
            { name: "歌曲0", src: "audio/music0.mp3", cover: "images/record0.jpg", duration: 243 },
            { name: "歌曲1", src: "audio/music1.mp3", cover: "images/record1.jpg", duration: 210 },
            { name: "歌曲2", src: "audio/music2.mp3", cover: "images/record2.jpg", duration: 198 },
            { name: "歌曲3", src: "audio/music3.mp3", cover: "images/record3.jpg", duration: 225 }
        ];

        const bgImages = [
            "images/bg0.png",
            "images/bg1.png",
            "images/bg2.png",
            "images/bg3.png"
        ];
        let currentBgIndex = 0;

        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progress = document.getElementById('progress');
        const currentTimeSpan = document.getElementById('currentTime');
        const totalTimeSpan = document.getElementById('totalTime');
        const songNameSpan = document.getElementById('songName');
        const coverImg = document.getElementById('coverImg');
        const coverDiv = document.getElementById('cover');
        const playlistToggle = document.getElementById('playlistToggle');
        const playlistDiv = document.getElementById('playlist');
        const bgToggleBtn = document.getElementById('bgToggleBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeValue = document.getElementById('volumeValue');
        const muteBtn = document.getElementById('muteBtn');

        let currentIndex = 0;
        let isPlaying = false;
        let isMuted = false;
        let lastVolume = 80;

        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function switchBackground() {
            currentBgIndex = (currentBgIndex + 1) % bgImages.length;
            document.body.style.backgroundImage = `url('${bgImages[currentBgIndex]}')`;
        }

        function setVolume(value) {
            let volume = value / 100;
            if (volume < 0) volume = 0;
            if (volume > 1) volume = 1;
            audio.volume = volume;
            volumeSlider.value = value;
            volumeValue.textContent = value + '%';
            
            if (value == 0) {
                muteBtn.textContent = '🔇';
                isMuted = true;
            } else {
                if (isMuted) {
                    isMuted = false;
                }
                muteBtn.textContent = '🔊';
            }
        }

        function toggleMute() {
            if (isMuted) {
                setVolume(lastVolume);
                isMuted = false;
            } else {
                lastVolume = parseInt(volumeSlider.value);
                setVolume(0);
                isMuted = true;
            }
        }

        function loadSong(index) {
            const song = playlist[index];
            if (!song) return;
            
            songNameSpan.textContent = song.name;
            coverImg.src = song.cover;
            audio.src = song.src;
            audio.load();
            
            audio.addEventListener('loadedmetadata', function onLoad() {
                totalTimeSpan.textContent = formatTime(audio.duration);
                progress.max = audio.duration;
                audio.removeEventListener('loadedmetadata', onLoad);
            });
            
            progress.value = 0;
            currentTimeSpan.textContent = '00:00';
            updatePlaylistActive();
            
            if (isPlaying) {
                audio.play().catch(e => console.log('自动播放被阻止，请手动点击播放'));
            }
        }

        function playSong() {
            audio.play();
            isPlaying = true;
            playBtn.textContent = '⏸';
            coverDiv.classList.add('playing');
        }

        function pauseSong() {
            audio.pause();
            isPlaying = false;
            playBtn.textContent = '▶';
            coverDiv.classList.remove('playing');
        }

        function togglePlay() {
            if (isPlaying) {
                pauseSong();
            } else {
                playSong();
            }
        }

        function nextSong() {
            currentIndex = (currentIndex + 1) % playlist.length;
            loadSong(currentIndex);
            if (isPlaying) {
                audio.play();
            }
        }

        function prevSong() {
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            loadSong(currentIndex);
            if (isPlaying) {
                audio.play();
            }
        }

        function updatePlaylistActive() {
            const items = document.querySelectorAll('.playlist-item');
            items.forEach((item, idx) => {
                if (idx === currentIndex) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        function renderPlaylist() {
            playlistDiv.innerHTML = '';
            playlist.forEach((song, index) => {
                const item = document.createElement('div');
                item.className = 'playlist-item';
                if (index === currentIndex) item.classList.add('active');
                item.innerHTML = `
                    <img src="${song.cover}" alt="封面">
                    <div class="item-info">
                        <div class="song-title">${song.name}</div>
                        <div class="song-artist">点击播放</div>
                    </div>
                `;
                item.addEventListener('click', () => {
                    currentIndex = index;
                    loadSong(currentIndex);
                    if (isPlaying) {
                        audio.play();
                    } else {
                        playSong();
                    }
                    playlistDiv.classList.remove('show');
                });
                playlistDiv.appendChild(item);
            });
        }

        function updateProgress() {
            if (audio.duration) {
                const current = audio.currentTime;
                progress.value = current;
                currentTimeSpan.textContent = formatTime(current);
            }
        }

        function setProgress(e) {
            const newTime = e.target.value;
            audio.currentTime = newTime;
            currentTimeSpan.textContent = formatTime(newTime);
        }

        function onSongEnd() {
            nextSong();
        }

        function togglePlaylist() {
            playlistDiv.classList.toggle('show');
        }

        playBtn.addEventListener('click', togglePlay);
        prevBtn.addEventListener('click', prevSong);
        nextBtn.addEventListener('click', nextSong);
        audio.addEventListener('timeupdate', updateProgress);
        audio.addEventListener('ended', onSongEnd);
        progress.addEventListener('input', setProgress);
        playlistToggle.addEventListener('click', togglePlaylist);
        bgToggleBtn.addEventListener('click', switchBackground);
        volumeSlider.addEventListener('input', (e) => setVolume(parseInt(e.target.value)));
        muteBtn.addEventListener('click', toggleMute);

        document.addEventListener('click', (e) => {
            if (!playlistDiv.contains(e.target) && e.target !== playlistToggle) {
                playlistDiv.classList.remove('show');
            }
        });

        renderPlaylist();
        loadSong(0);
        setVolume(80);
    </script>
</body>
</html>
